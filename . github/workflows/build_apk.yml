name: Build IPD PLASMA Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Android Native Project Structure
        run: |
          flutter create --org com.kencanaagri.ipdplasma --project-name ipd_plasma_native .
          
          # Tambahkan izin Kamera, GPS, dan Penyimpanan ke AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <application/' $MANIFEST
          
          # Ubah label nama aplikasi di HP menjadi IPD PLASMA
          sed -i 's/android:label="ipd_plasma_native"/android:label="IPD PLASMA"/' $MANIFEST

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi=false

      - name: Upload IPD PLASMA APK
        uses: actions/upload-artifact@v4
        with:
          name: IPD-PLASMA-Native-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
