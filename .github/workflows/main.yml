name: Build IPD PLASMA Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cek Kelengkapan File Proyek
        run: |
          if [ ! -f "pubspec.yaml" ] || [ ! -f "lib/main.dart" ]; then
            echo "ERROR: File pubspec.yaml atau lib/main.dart belum ada!"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Generate & Configure Android Native Project + Kencana Icon
        run: |
          flutter create --org com.kencanaagri.ipdplasma --project-name ipd_plasma_native .
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <application/' $MANIFEST
          sed -i 's/android:label="ipd_plasma_native"/android:label="IPD PLASMA"/' $MANIFEST

          python3 -c '
          import os
          from PIL import Image, ImageDraw
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, sz in sizes.items():
              p = f"android/app/src/main/res/{folder}"
              os.makedirs(p, exist_ok=True)
              img = Image.new("RGBA", (sz, sz), (27, 94, 32, 255))
              d = ImageDraw.Draw(img)
              m = int(sz * 0.08)
              d.rounded_rectangle([m, m, sz-m, sz-m], radius=int(sz*0.2), fill=(27, 94, 32, 255), outline=(251, 192, 45, 255), width=max(2, int(sz*0.05)))
              c = sz // 2
              r = int(sz * 0.28)
              d.polygon([(c, c-r), (c+r, c), (c, c+r), (c-r, c)], fill=(251, 192, 45, 255))
              d.ellipse([c-int(r*0.4), c-int(r*0.4), c+int(r*0.4), c+int(r*0.4)], fill=(27, 94, 32, 255))
              img.save(f"{p}/ic_launcher.png")
          ' || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload IPD PLASMA APK
        uses: actions/upload-artifact@v4
        with:
          name: IPD-PLASMA-Native-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
