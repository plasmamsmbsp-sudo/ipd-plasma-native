name: Build IPD PLASMA Universal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Konfigurasi Android & Perbaikan Otomatis Plugin Gradle
        run: |
          flutter create . --platforms=android --project-name ipd_plasma
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true
          cat << 'EOF' >> android/build.gradle

          subprojects {
              beforeEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (!project.ext.has('flutter')) {
                              project.ext.flutter = [
                                  compileSdkVersion: 35,
                                  minSdkVersion: 21,
                                  targetSdkVersion: 34,
                                  ndkVersion: "26.1.10909125"
                              ]
                          }
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPD-PLASMA-Universal-v2
          path: build/app/outputs/flutter-apk/app-release.apk
          
