name: Build IPD PLASMA Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cek Kelengkapan File Proyek
        run: |
          if [ ! -f "pubspec.yaml" ] || [ ! -f "lib/main.dart" ]; then
            echo "ERROR: File pubspec.yaml atau lib/main.dart belum ada!"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Generate Android Project & Kencana Official Icon
        run: |
          flutter create --org com.kencanaagri.ipdplasma --project-name ipd_plasma_native .
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <application/' $MANIFEST
          sed -i 's/android:label="ipd_plasma_native"/android:label="IPD PLASMA"/' $MANIFEST

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle
          fi

          if [ -f "android/settings.gradle.kts" ]; then
            sed -i -E 's/id\("org\.jetbrains\.kotlin\.android"\)[[:space:]]+version[[:space:]]+"[^"]+"/id("org.jetbrains.kotlin.android") version "2.1.0"/g' android/settings.gradle.kts
          fi
          if [ -f "android/settings.gradle" ]; then
            sed -i -E 's/id "org\.jetbrains\.kotlin\.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.1.0"/g' android/settings.gradle
          fi

          python3 -c '
          import os, math
          from PIL import Image, ImageDraw
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, sz in sizes.items():
              p = f"android/app/src/main/res/{folder}"
              os.makedirs(p, exist_ok=True)
              img = Image.new("RGBA", (sz, sz), (242, 245, 249, 255))
              d = ImageDraw.Draw(img)
              cx, cy = sz * 0.5, sz * 0.62
              r_out = sz * 0.42
              d.pieslice([cx - r_out, cy - r_out, cx + r_out, cy + r_out], 195, 345, fill=(10, 104, 54, 255))
              r_in = sz * 0.14
              d.ellipse([cx - r_in, cy - r_in*0.6, cx + r_in, cy + r_in*1.4], fill=(242, 245, 249, 255))
              for ang in [-55, -28, 0, 28, 55]:
                  rad = math.radians(ang - 90)
                  x2 = cx + math.cos(rad) * (r_out * 0.85)
                  y2 = cy + math.sin(rad) * (r_out * 0.85)
                  d.line([(cx, cy - sz*0.02), (x2, y2)], fill=(247, 227, 0, 255), width=max(2, int(sz*0.04)))
              bar_y1, bar_y2 = int(sz * 0.65), int(sz * 0.86)
              d.rounded_rectangle([int(sz*0.14), bar_y1, int(sz*0.86), bar_y2], radius=max(2, int(sz*0.03)), fill=(179, 142, 12, 255))
              img.save(f"{p}/ic_launcher.png")
          ' || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload IPD PLASMA APK
        uses: actions/upload-artifact@v4
        with:
          name: IPD-PLASMA-Native-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
